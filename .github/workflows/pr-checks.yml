name: PR Checks

on:
  pull_request:
    branches:
      - master

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd gaspago-api
          npm install

      - name: TypeScript check
        run: |
          cd gaspago-api
          npx tsc --noEmit
