services:
  api:
    build:
      context: ./gaspago-api
      dockerfile: Dockerfile
    container_name: gaspago-api
    restart: unless-stopped
    ports:
      - "3030:3000"
    env_file:
      - ./gaspago-api/.env
    environment:
      DATABASE_URL: postgresql://gaspago:gaspago@postgres:5432/gaspago
      REDIS_URL: redis://redis:6379
      # Defaults que o admin pode sobrescrever via SuperAdmin → Credenciais
      ASAAS_ENV: sandbox
      # MinIO interno — resolvido automaticamente pelo SystemConfigService (fallback env)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: gaspago
      MINIO_SECRET_KEY: gaspago123
      MINIO_BUCKET_PUBLIC: gaspago-public
      MINIO_BUCKET_PRIVATE: gaspago-private
      MINIO_PUBLIC_URL: http://localhost:9010/gaspago-public
      # ADMIN_EMAIL e ADMIN_PASSWORD_HASH ficam em gaspago-api/.env (fora do git)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gaspago

  web:
    build:
      context: ./gaspago-web
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time — see Dockerfile comment.
        # Overrides .env.production's real gaspago.app domain for this local build.
        NEXT_PUBLIC_API_URL: http://localhost:3030
    container_name: gaspago-web
    restart: unless-stopped
    ports:
      - "3031:3001"
    environment:
      API_URL: http://api:3000
    depends_on:
      - api
    networks:
      - gaspago

  postgres:
    image: postgres:16-alpine
    container_name: gaspago-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gaspago
      POSTGRES_PASSWORD: gaspago
      POSTGRES_DB: gaspago
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaspago"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gaspago

  redis:
    image: redis:7-alpine
    container_name: gaspago-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gaspago

  minio:
    image: minio/minio:latest
    container_name: gaspago-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"   # S3 API
      - "9011:9001"   # MinIO Console (browser)
    environment:
      MINIO_ROOT_USER: gaspago
      MINIO_ROOT_PASSWORD: gaspago123
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gaspago

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  gaspago:
    driver: bridge
